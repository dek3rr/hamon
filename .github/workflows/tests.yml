name: Unit testing

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Checks with pre-commit
        uses: pre-commit/action@v3.0.1

  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: pip install .[testing]
      # Non-3.12 legs run the suite directly. The 3.12 leg (our base supported
      # version) runs it once under coverage instead, which doubles as this
      # project's coverage gate — so the suite is never executed twice on the
      # same interpreter just for coverage.
      - name: Run unit tests
        if: matrix.python-version != '3.12'
        run: pytest -v -m "not slow" tests/
      - name: Run unit tests with coverage
        if: matrix.python-version == '3.12'
        run: |
          coverage run --source hamon -m pytest -v -m "not slow" tests/
          coverage report --fail-under=90
