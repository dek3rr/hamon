[project]
name = "hamon"
version = "0.9.0"
description = "JAX-native thermal sampling for discrete energy-based models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "dek3rr" },
]
maintainers = [
    { name = "dek3rr" },
]
keywords = [
    "jax",
    "mcmc",
    "parallel-tempering",
    "gibbs-sampling",
    "energy-based-models",
    "ising",
    "probabilistic-graphical-models",
    "sampling",
    "gpu",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

dependencies = [
    "equinox>=0.11.2",
    "jaxtyping>=0.3.10",
]

[project.urls]
Repository = "https://github.com/dek3rr/hamon"
Documentation = "https://dek3rr.github.io/hamon"
Issues = "https://github.com/dek3rr/hamon/issues"
Changelog = "https://github.com/dek3rr/hamon/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
examples = [
    "jupyter>=1.0",
    "matplotlib>=3.11.0",
    "networkx>=3.6.0",
    "scikit-learn>=1.9.0",
]
testing = [
    "coverage>=7.15.0",
    "pytest>=9.1.0",
    "nbmake>=1.5",
    "networkx>=3.6.0",
    "optax>=0.2.8",
    "setuptools>=83.0.0",
]
development = [
    "ruff>=0.15.21",
    "pyright>=1.1.411",
    "pytest-cov>=7.1.0",
    "build>=1.5.1",
]
docs = [
    "hippogriffe>=0.2.0",
    "griffe>=1.7",
    "mkdocs>=1.6",
    "mkdocs-include-exclude-files>=0.1.0",
    "mkdocs-ipynb>=0.1.0",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.28",
    "pymdown-extensions>=10.14",
]

[tool.setuptools]
packages = { find = { include = ["hamon", "hamon.*"] } }

[tool.ruff]
extend-include = ["*.ipynb"]
src = []
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# ruff's pyupgrade ("UP") rules replace the standalone pyupgrade hook.
# PEP 695 rewrites (type-alias statement / type parameters) are outside
# pyupgrade's scope, so they stay disabled.
extend-select = ["UP"]
ignore = ["F722", "UP040", "UP046", "UP047"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: exercises GPU execution (auto-skipped when no GPU is visible)",
]

[tool.pyright]
reportUnnecessaryTypeIgnoreComment = true
include = ["hamon"]
