[project]
name = "hamon"
version = "0.9.0"
description = "JAX-native thermal sampling for discrete energy-based models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "dek3rr" },
]
maintainers = [
    { name = "dek3rr" },
]
keywords = [
    "jax",
    "mcmc",
    "parallel-tempering",
    "gibbs-sampling",
    "energy-based-models",
    "ising",
    "probabilistic-graphical-models",
    "sampling",
    "gpu",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

dependencies = [
    "jax>=0.10.0",
    "equinox>=0.11.2",
    "jaxtyping>=0.3.10",
]

[project.urls]
Repository = "https://github.com/dek3rr/hamon"
Documentation = "https://dek3rr.github.io/hamon"
Issues = "https://github.com/dek3rr/hamon/issues"
Changelog = "https://github.com/dek3rr/hamon/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
examples = [
    "jupyter>=1.0",
    "matplotlib>=3.11.0",
    "networkx>=3.6.0",
]
testing = [
    "coverage>=7.15.0",
    "pytest>=9.1.0",
    "nbmake>=1.5",
    "networkx>=3.6.0",
]
development = [
    "ruff>=0.15.21",
    "pyright>=1.1.411",
    "build>=1.5.1",
    # optax is used only by benchmarks/train_mnist.py (a manual training demo),
    # not by the test suite — kept here for developers who run the benchmarks.
    "optax>=0.2.8",
]
docs = [
    "hippogriffe>=0.2.0",
    "griffe>=1.7",
    "mkdocs>=1.6",
    "mkdocs-include-exclude-files>=0.1.0",
    "mkdocs-ipynb>=0.1.0",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.28",
    "pymdown-extensions>=10.14",
]
# Non-production trial toolchain for evaluating Zensical (the successor to
# MkDocs + Material for MkDocs) against our existing mkdocs.yml. Install
# alongside `docs`, i.e. `pip install .[docs,docs-zensical]`: Zensical reads
# the MkDocs config directly but still relies on the MkDocs plugin packages
# (mkdocstrings, ipynb, hippogriffe, include-exclude-files) being importable,
# which the `docs` group supplies. This drives the docs-zensical-trial CI job
# only; the live site is still built by MkDocs (see docs.yml). See
# .github/ZENSICAL_TRIAL.md for the current compatibility status.
docs-zensical = [
    "zensical>=0.0.50",
]

[tool.setuptools]
packages = { find = { include = ["hamon", "hamon.*"] } }

[tool.ruff]
extend-include = ["*.ipynb"]
src = []
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# ruff's pyupgrade ("UP") rules replace the standalone pyupgrade hook.
# PEP 695 rewrites (type-alias statement / type parameters) are outside
# pyupgrade's scope, so they stay disabled.
extend-select = ["UP"]
ignore = ["F722", "UP040", "UP046", "UP047"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: exercises GPU execution (auto-skipped when no GPU is visible)",
]

[tool.pyright]
reportUnnecessaryTypeIgnoreComment = true
include = ["hamon"]
