repos:
  # 1. Lint with autofix. ruff's "UP" rules modernise syntax to the minimum
  #    supported Python (py312), replacing a standalone pyupgrade hook.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix]

  # 2. Format the result of the fixer.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-format
        args: [--line-length=88]

  # 3. Type-check last.
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.411
    hooks:
      - id: pyright
        additional_dependencies: [equinox, jaxtyping, networkx]
        files: hamon/
